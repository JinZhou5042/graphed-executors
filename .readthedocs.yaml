# Read the Docs configuration — builds the `graphed-executors` documentation.
# Mirrors the "docs (sphinx -W)" job in .github/workflows/ci.yml.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    # `graphed` is built from git here, and it is a maturin/PyO3 package, so RTD needs cargo.
    rust: "latest"

python:
  install:
    # 1) `graphed`, taken from git in docs/requirements.txt (RTD's own pin; CI pins separately).
    - requirements: docs/requirements.txt
    # 2) graphed-executors itself + its docs toolchain (sphinx, furo). `graphed` is already satisfied
    #    by step 1, so pip does not try to fetch the bare `graphed` dependency from PyPI.
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
