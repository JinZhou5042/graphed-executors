name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # the former core/debug/frontend/numpy/awkward siblings are now one consolidated package
  # Pinned, not @main: graphed is an unpinned upstream whose merges can redden this frozen suite with
  # no local change. At graphed PR-A1's head (RunControl) until that merges; then its merge commit.
  GRAPHED: "graphed[awkward,numpy] @ git+https://github.com/graphed-org/graphed@c551533f966bcdc35fe68727f13472d5b8d019b8"
  # corpus stays a separate package (test fixtures only, not shipped in the graphed wheel)
  CORPUS: "graphed-corpus @ git+https://github.com/graphed-org/graphed-corpus-mvp@main"
  # The frozen tree fills real histograms across the process boundary. Unlike CORPUS, omitting this
  # fails SILENTLY: graphed-histogram IS on PyPI, so a missing line quietly installs the released
  # wheel instead of the main this suite is frozen against, and the job goes green on the wrong
  # package. Needed in every job that collects tests/frozen.
  HISTOGRAM: "graphed-histogram @ git+https://github.com/graphed-org/graphed-histogram@main"

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}"
          python -m pip install -e ".[dev]"
      - uses: astral-sh/setup-uv@v5
      - name: Lint + types (pre-commit hooks via prek)
        run: uvx prek@0.4.5 run --all-files --show-diff-on-failure
      - name: Pytest (frozen + extra) + whole-package coverage (>=90%)
        run: pytest tests/frozen tests/extra --cov=graphed_executors --cov-branch --cov-report=term-missing
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml -o coverage.xml
          # ponytail: self-retiring — origin/main carries the gate only after this PR lands, so this
          # rollout PR runs diff-cover informationally instead of failing on its own delta.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --exclude "*/dask_backend/*" "*/common/*" "*/parsl_backend/*" \
              "src/graphed_executors/taskvine_backend/*.py"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --exclude "*/dask_backend/*" "*/common/*" "*/parsl_backend/*" \
              "src/graphed_executors/taskvine_backend/*.py"
          fi

  # Build the VineGraph development branch inside Conda. The regular matrix has no
  # CCTools build, so its TaskVine tests importorskip; this job is the required gate.
  test-taskvine:
    name: test-taskvine (Conda + VineGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get VineGraph source
        run: |
          git clone --filter=blob:none https://github.com/JinZhou5042/cctools.git cctools-src
          git -C cctools-src checkout e9deeb451e54cec60fcc0c95fb77798aeef561ba
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: cctools-src/environment.yml
          create-args: python=3.13
          init-shell: bash
          cache-downloads: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build VineGraph and install the executor
        shell: bash -el {0}
        run: |
          cd cctools-src
          ./configure --with-base-dir "$CONDA_PREFIX" --prefix "$CONDA_PREFIX"
          make -j4
          make install
          cd ..
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}"
          python -m pip install -e ".[dev,taskvine]"
          python -c "from ndcctools.taskvine.vine_graph import VineGraph, Workflow"
          vine_worker --version
      - name: Local TaskVine tests
        shell: bash -el {0}
        run: |
          export PYTHONNOUSERSITE=1
          pytest tests/extra/taskvine --cov-config=.coveragerc-taskvine --cov --cov-branch --cov-fail-under=0
      - name: Real worker tests
        shell: bash -el {0}
        run: |
          export PYTHONNOUSERSITE=1 GTV_WORKER=1
          timeout 600s pytest tests/extra/taskvine/test_backend.py \
            -k 'plan_matches_reference or worker_error_preserves_type' \
            --cov-config=.coveragerc-taskvine --cov --cov-append --cov-branch --cov-fail-under=0
      - name: TaskVine per-file coverage gate
        shell: bash -el {0}
        run: |
          coverage report --rcfile=.coveragerc-taskvine --fail-under=90
          coverage json --rcfile=.coveragerc-taskvine -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: TaskVine diff coverage gate
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash -el {0}
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-taskvine -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
            --include "src/graphed_executors/taskvine_backend/*.py"

  # Free-threaded / bleeding-edge Pythons (plan A.5): genuinely exercises concurrency under no-GIL.
  # Experimental + non-blocking (awkward wheels may lag on 3.14 / 3.14t).
  test-experimental:
    name: test (experimental) py${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}"
          python -m pip install -e ".[dev]"
          pytest tests/frozen

  # The dask.distributed backend (graphed_executors.dask_backend) lives behind the [dask] extra and
  # importorskips out of the main matrix. This dedicated job installs it and runs the m42 dask suite
  # with coverage scoped to the NEW subpackages only (.coveragerc-dask, fail_under 90 — the §B.3
  # diff-coverage gate). pyarrow is a runtime need of the parquet parity surfaces (ak.to_parquet).
  # m43/m44/m45 extend this job's pytest path (cov scope unchanged: all of it is under dask_backend/).
  # m45's dask-free resolution/gates tests also run on the MAIN matrix via `pytest tests/frozen` (no
  # distributed needed — same as m44's capability gate); the cluster dispatch/join tests importorskip
  # out there and run HERE, covering api.py under the .coveragerc-dask gate.
  test-dask:
    name: test-dask py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package with the dask extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" pyarrow pandas
          python -m pip install -e ".[dev,dask]"
      - name: Pytest m42+m43+m44+m45 dask suite + extra witnesses + scoped coverage gate (>=90%)
        # bare `--cov` (m46, tests-B-cov-2): a path-valued `--cov=` OVERRIDES the config `[run] source`
        # (verified pytest-cov 7.1.0), which would silently discard the m46-added `common.tasks_engine`
        # source and gate the moved m43 engine by ZERO jobs. The `.coveragerc-dask` source is authoritative.
        run: |
          pytest tests/frozen/m42 tests/frozen/m43 tests/frozen/m44 tests/frozen/m45 \
            tests/frozen/m63/test_m63_submit_dask.py \
            tests/frozen/m65/test_m65a3_control_dask.py tests/frozen/m65/test_m65a3_control_submit.py \
            tests/frozen/m65/test_m65a3_control_stop.py \
            tests/extra/m43 tests/extra/m44 \
            --cov-config=.coveragerc-dask \
            --cov-branch --cov \
            --cov-report=term-missing
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json --rcfile=.coveragerc-dask -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-dask -o coverage.xml
          # `--include` is glob.glob, not fnmatch (diff_cover 10.6.0 diff_reporter._is_path_excluded):
          # these patterns must expand to real checkout-relative paths, mirroring .coveragerc-dask's
          # source. The two parsl-gated `common/` modules are omitted from this job's coverage, so
          # diff-cover finds no lines for them here and the parsl job's step is their only gate.
          # ponytail: self-retiring guard, see the main job's step for why.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --include "src/graphed_executors/submit/**/*.py" "src/graphed_executors/dask_backend/**/*.py" \
              "src/graphed_executors/common/**/*.py"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --include "src/graphed_executors/submit/**/*.py" "src/graphed_executors/dask_backend/**/*.py" \
              "src/graphed_executors/common/**/*.py"
          fi

  # The parsl executor backend (graphed_executors.parsl_backend) + the relay engine live behind the
  # [parsl] extra and importorskip out of the main matrix. This dedicated job installs it and runs the
  # frozen m46 suite with coverage scoped to the parsl-only modules (.coveragerc-parsl, fail_under 90).
  # Gate on 3.12 (parsl's classifier ceiling); observe 3.13 non-blocking (parsl has no upper cap, we
  # observe not gate); 3.14/3.14t never install the extra (free-threaded parsl is upstream-unverified).
  # pyarrow is a MEASURED runtime need of the non-inner numpy join arms (masked blocks wire over Arrow)
  # — the same pairing the test-dask job uses; without it those frozen arms importorskip out forever.
  test-parsl:
    name: test-parsl py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.python == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package with the parsl extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" pyarrow
          python -m pip install -e ".[dev,parsl]"
      - name: Pytest frozen m46 + m47 suites + extra witnesses + scoped coverage gate (>=90%)
        # The §1.4 transport bodies (peer shuffle/join + HTTP block plane) run ONLY in HTEX WORKER
        # processes, exec'd fresh — coverage's driver tracer never sees them. A portable process-start
        # hook (coverage.py "Measuring subprocesses") + COVERAGE_PROCESS_START makes each worker
        # self-measure; pytest-cov leaves those worker data files uncombined, so we fold the driver
        # file back to a parallel file and `coverage combine` the driver + all worker data before the
        # gate. bare `--cov` stays MANDATORY (a modifier alone is a silent no-op — pytest-cov 7.1.0);
        # NO path-valued `--cov=` (it would OVERRIDE the `.coveragerc-parsl` source — plan §1.6 item 3
        # / tests-B-cov-1). `--cov-fail-under=0` defers the gate to the post-combine `coverage report`
        # (the inline gate would fire on the driver-only subset before the workers are folded in).
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc-parsl
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc-parsl
        run: |
          python -c "import sysconfig, pathlib; pathlib.Path(sysconfig.get_path('purelib'), 'graphed_subcov.pth').write_text('import coverage; coverage.process_startup()\n')"
          pytest tests/frozen/m46 tests/frozen/m47 tests/extra/m47 \
            tests/frozen/m63/test_m63_submit_parsl.py \
            tests/frozen/m65/test_m65a3_control_parsl.py \
            --cov --cov-config=.coveragerc-parsl \
            --cov-branch --cov-fail-under=0
          # settle: force any lingering HTEX pool workers to flush their subprocess coverage
          # (sigterm=true in .coveragerc-parsl) and let the files land, so the combine folds ALL
          # worker data. The prompt-combine raced late worker flushes (review FU-2) and a
          # scheduling-unlucky run could fold fewer files and dip the union toward 90.
          pkill -TERM -f process_worker_pool || true
          sleep 3
          mv .coverage .coverage.driver
          coverage combine
          coverage report --show-missing --fail-under=90
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json --rcfile=.coveragerc-parsl -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-parsl -o coverage.xml
          # `--include` is glob.glob, not fnmatch — see the test-dask job's step for the measurement.
          # ponytail: self-retiring guard, see the main job's step for why.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --include "src/graphed_executors/parsl_backend/**/*.py" \
              "src/graphed_executors/common/relay_engine.py" "src/graphed_executors/common/http_plane.py"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --include "src/graphed_executors/parsl_backend/**/*.py" \
              "src/graphed_executors/common/relay_engine.py" "src/graphed_executors/common/http_plane.py"
          fi

  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}"
          # docs only needs runtime deps + sphinx; the dev-extra backends are not on PyPI.
          python -m pip install -e ".[docs]"
          sphinx-build -W -b html docs docs/_build/html

  # The single check the ruleset requires for the merge queue: matrix legs would each need
  # naming there, and advisory (continue-on-error) jobs are left out on purpose.
  ci-required:
    name: ci required
    if: always()
    needs: [test, test-taskvine, test-dask, test-parsl, docs]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
