name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # the former core/debug/frontend/numpy/awkward siblings are now one consolidated package
  # Pinned, not @main: graphed is an unpinned upstream whose merges can redden this frozen suite with
  # no local change. At graphed#63's merge commit on main (the resolve walk: resolve_services forwarded
  # through collate and aggregate_plan), above the service surface of #58/#61 (ServiceSpec,
  # split_endpoint, bind_services, require_bound) that m68a runs on. Moves to the first release carrying
  # both. A git install builds the Rust core, so every job installing it needs a Rust
  # toolchain.
  GRAPHED: "graphed[awkward,numpy] @ git+https://github.com/graphed-org/graphed@a51bee4ff0b40c33cd68cca593f8a74c11d9f516"
  # corpus stays a separate package (test fixtures only, not shipped in the graphed wheel)
  CORPUS: "graphed-corpus @ git+https://github.com/graphed-org/graphed-corpus-mvp@main"
  # The frozen tree fills real histograms across the process boundary. Unlike CORPUS, omitting this
  # fails SILENTLY: graphed-histogram IS on PyPI, so a missing line quietly installs the released
  # wheel instead of the main this suite is frozen against, and the job goes green on the wrong
  # package. Needed in every job that collects tests/frozen. At the histogram m69b PR's head until it
  # merges; its histserv extra serves the m69b histograms (test-experimental drops it: no cp314t grpcio).
  HISTOGRAM: "graphed-histogram[histserv] @ git+https://github.com/graphed-org/graphed-histogram@3830acaa26a9a5860892f263c0b0ca8c96efadb8"
  # test-hgg only: the coffea fork with graphed mode, the uproot commit it needs (uproot.graphed is
  # unreleased), and HiggsDNA, installed --no-deps because its declared deps pull torch/xgboost/onnx.
  COFFEA: "coffea @ git+https://github.com/graphed-org/coffea-graphed-mvp@b2612ab03932ba61f183eb5f582870109020446b"
  UPROOT: "uproot @ git+https://github.com/scikit-hep/uproot5@ca3a8a28c0846ea4c6f42452f69e3cce2939bf62"
  HIGGS_DNA: "higgs-dna @ git+https://gitlab.cern.ch/cms-analysis/general/HiggsDNA.git@d17930519cafd8eec06e74e4e9fb7add3cf62b5a"

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Twice the slowest leg: a wedged interpreter must fail here, not at GitHub's 6 h limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Python from uv (macOS)
        # setup-python's macOS builds stall 35-70 s in each loopback reverse lookup (socket.getfqdn) on
        # macOS 15+ runners (actions/setup-python#1223); uv's python-build-standalone does not.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv venv --seed --python-preference only-managed --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c "import socket, time; t = time.monotonic(); socket.getfqdn(); print(f'getfqdn() in {time.monotonic() - t:.2f}s')"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}"
          python -m pip install -e ".[dev]"
          # the reference gRPC health servicer the m68a readiness checks are tested against (with grpcio)
          python -m pip install grpcio-health-checking
      - name: Lint + types (pre-commit hooks via prek)
        run: uvx prek@0.4.5 run --all-files --show-diff-on-failure
      - name: Pytest (frozen + extra) + whole-package coverage (>=90%)
        run: pytest tests/frozen tests/extra -o faulthandler_timeout=300 --cov=graphed_executors --cov-branch --cov-report=term-missing
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml -o coverage.xml
          # ponytail: self-retiring — origin/main carries the gate only after this PR lands, so this
          # rollout PR runs diff-cover informationally instead of failing on its own delta.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --exclude "*/dask_backend/*" "*/common/*" "*/parsl_backend/*" "*/htcondor_backend/*"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --exclude "*/dask_backend/*" "*/common/*" "*/parsl_backend/*" "*/htcondor_backend/*"
          fi

  # Free-threaded / bleeding-edge Pythons (plan A.5): genuinely exercises concurrency under no-GIL.
  # Experimental + non-blocking (awkward wheels may lag on 3.14 / 3.14t).
  test-experimental:
    name: test (experimental) py${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # The leg takes ~9 min; a wedged interpreter must fail here, not at GitHub's 6 h limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${HISTOGRAM/\[histserv\]/}"
          python -m pip install -e ".[dev]"
          pytest tests/frozen -o faulthandler_timeout=300

  # The dask.distributed backend (graphed_executors.dask_backend) lives behind the [dask] extra and
  # importorskips out of the main matrix. This dedicated job installs it and runs the m42 dask suite
  # with coverage scoped to the NEW subpackages only (.coveragerc-dask, fail_under 90 — the §B.3
  # diff-coverage gate). pyarrow is a runtime need of the parquet parity surfaces (ak.to_parquet).
  # m43/m44/m45 extend this job's pytest path (cov scope unchanged: all of it is under dask_backend/).
  # m45's dask-free resolution/gates tests also run on the MAIN matrix via `pytest tests/frozen` (no
  # distributed needed — same as m44's capability gate); the cluster dispatch/join tests importorskip
  # out there and run HERE, covering api.py under the .coveragerc-dask gate.
  test-dask:
    name: test-dask py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package with the dask extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" pyarrow pandas
          python -m pip install -e ".[dev,dask]"
          # submit/ is gated here too: tests/extra/m68a covers the service set, its gRPC check included
          python -m pip install grpcio-health-checking
      - name: Pytest m42+m43+m44+m45 dask suite + extra witnesses + scoped coverage gate (>=90%)
        # bare `--cov` (m46, tests-B-cov-2): a path-valued `--cov=` OVERRIDES the config `[run] source`
        # (verified pytest-cov 7.1.0), which would silently discard the m46-added `common.tasks_engine`
        # source and gate the moved m43 engine by ZERO jobs. The `.coveragerc-dask` source is authoritative.
        run: |
          pytest tests/frozen/m42 tests/frozen/m43 tests/frozen/m44 tests/frozen/m45 \
            tests/frozen/m63/test_m63_submit_dask.py \
            tests/frozen/m65/test_m65a3_control_dask.py tests/frozen/m65/test_m65a3_control_submit.py \
            tests/frozen/m65/test_m65a3_control_stop.py \
            tests/frozen/m65/test_m65b_push_submit.py tests/frozen/m65/test_m65b_push_dask.py \
            tests/frozen/m68a/test_scope_dask_memory.py \
            tests/frozen/m68c/test_m68c_submit_dask.py tests/frozen/m68c/test_m68c_submit_thread.py \
            tests/extra/m43 tests/extra/m44 tests/extra/m68a tests/extra/m68c \
            tests/extra/m69b/test_m69b_schedulable.py tests/extra/m69b/test_m69b_dask_driver_check.py \
            tests/frozen/m68d tests/extra/m68d \
            --cov-config=.coveragerc-dask \
            --cov-branch --cov \
            --cov-report=term-missing
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json --rcfile=.coveragerc-dask -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-dask -o coverage.xml
          # `--include` is glob.glob, not fnmatch (diff_cover 10.6.0 diff_reporter._is_path_excluded):
          # these patterns must expand to real checkout-relative paths, mirroring .coveragerc-dask's
          # source. The two parsl-gated `common/` modules are omitted from this job's coverage, so
          # diff-cover finds no lines for them here and the parsl job's step is their only gate.
          # ponytail: self-retiring guard, see the main job's step for why.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --include "src/graphed_executors/submit/**/*.py" "src/graphed_executors/dask_backend/**/*.py" \
              "src/graphed_executors/common/**/*.py"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --include "src/graphed_executors/submit/**/*.py" "src/graphed_executors/dask_backend/**/*.py" \
              "src/graphed_executors/common/**/*.py"
          fi

  # The parsl executor backend (graphed_executors.parsl_backend) + the relay engine live behind the
  # [parsl] extra and importorskip out of the main matrix. This dedicated job installs it and runs the
  # frozen m46 suite with coverage scoped to the parsl-only modules (.coveragerc-parsl, fail_under 90).
  # Gate on 3.12 (parsl's classifier ceiling); observe 3.13 non-blocking (parsl has no upper cap, we
  # observe not gate); 3.14/3.14t never install the extra (free-threaded parsl is upstream-unverified).
  # pyarrow is a MEASURED runtime need of the non-inner numpy join arms (masked blocks wire over Arrow)
  # — the same pairing the test-dask job uses; without it those frozen arms importorskip out forever.
  test-parsl:
    name: test-parsl py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.python == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package with the parsl extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" pyarrow
          python -m pip install -e ".[dev,parsl]"
      - name: Pytest frozen m46 + m47 suites + extra witnesses + scoped coverage gate (>=90%)
        # The §1.4 transport bodies (peer shuffle/join + HTTP block plane) run ONLY in HTEX WORKER
        # processes, exec'd fresh — coverage's driver tracer never sees them. A portable process-start
        # hook (coverage.py "Measuring subprocesses") + COVERAGE_PROCESS_START makes each worker
        # self-measure; pytest-cov leaves those worker data files uncombined, so we fold the driver
        # file back to a parallel file and `coverage combine` the driver + all worker data before the
        # gate. bare `--cov` stays MANDATORY (a modifier alone is a silent no-op — pytest-cov 7.1.0);
        # NO path-valued `--cov=` (it would OVERRIDE the `.coveragerc-parsl` source — plan §1.6 item 3
        # / tests-B-cov-1). `--cov-fail-under=0` defers the gate to the post-combine `coverage report`
        # (the inline gate would fire on the driver-only subset before the workers are folded in).
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc-parsl
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc-parsl
        run: |
          python -c "import sysconfig, pathlib; pathlib.Path(sysconfig.get_path('purelib'), 'graphed_subcov.pth').write_text('import coverage; coverage.process_startup()\n')"
          pytest tests/frozen/m46 tests/frozen/m47 tests/extra/m47 \
            tests/frozen/m63/test_m63_submit_parsl.py \
            tests/frozen/m65/test_m65a3_control_parsl.py \
            tests/frozen/m68c/test_m68c_submit_parsl.py \
            --cov --cov-config=.coveragerc-parsl \
            --cov-branch --cov-fail-under=0
          # settle: force any lingering HTEX pool workers to flush their subprocess coverage
          # (sigterm=true in .coveragerc-parsl) and let the files land, so the combine folds ALL
          # worker data. The prompt-combine raced late worker flushes (review FU-2) and a
          # scheduling-unlucky run could fold fewer files and dip the union toward 90.
          pkill -TERM -f process_worker_pool || true
          sleep 3
          mv .coverage .coverage.driver
          coverage combine
          coverage report --show-missing --fail-under=90
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json --rcfile=.coveragerc-parsl -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-parsl -o coverage.xml
          # `--include` is glob.glob, not fnmatch — see the test-dask job's step for the measurement.
          # ponytail: self-retiring guard, see the main job's step for why.
          if git cat-file -e origin/main:scripts/coverage_gate.py 2>/dev/null; then
            diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
              --include "src/graphed_executors/parsl_backend/**/*.py" \
              "src/graphed_executors/common/relay_engine.py" "src/graphed_executors/common/http_plane.py"
          else
            diff-cover coverage.xml --compare-branch=origin/main \
              --include "src/graphed_executors/parsl_backend/**/*.py" \
              "src/graphed_executors/common/relay_engine.py" "src/graphed_executors/common/http_plane.py"
          fi

  # The direct HTCondor backend (graphed_executors.htcondor_backend) needs the htcondor bindings, which
  # ship Linux wheels only, and a pool: this job installs a personal HTCondor and runs the m66, m67 and
  # m68a suites against it, with a Triton container serving tests/frozen/m68a/data/triton_models on
  # gRPC for the m68a service legs. Local pilots and drivers inherit COVERAGE_PROCESS_START and
  # self-measure as in test-parsl; COVERAGE_FILE is absolute because a driver runs in a job scratch
  # dir, not the workspace.
  test-htcondor:
    name: test-htcondor py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45  # m68a: + pulling the Triton image (several GB) and its model load
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Free disk for the Triton image
        # the tritonserver image is ~15 GB unpacked; the runner starts with less free than that
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - name: Start a personal HTCondor pool
        shell: bash
        run: |
          curl -fsSL https://get.htcondor.org | sudo /bin/bash -s -- --no-dry-run
          # jobs share the host /tmp (default: a private one), so a driver job's FS-auth file and its
          # pilots' initialdir under pytest's tmp_path are visible to the schedd, as on a shared-FS site
          echo "MOUNT_UNDER_SCRATCH =" | sudo tee /etc/condor/config.d/99-jobs-share-tmp
          # one simulated GPU (no device), so a GPU recipe matches a slot (m68b)
          printf '%s\n' 'use feature : GPUs' 'GPU_DISCOVERY_EXTRA = $(GPU_DISCOVERY_EXTRA) -simulate:2,1' \
            | sudo tee /etc/condor/config.d/99-sim-gpu
          sudo systemctl enable --now condor || sudo condor_master
          for i in $(seq 90); do
            condor_status -schedd -af Name 2>/dev/null | grep -q . && condor_status -af Name 2>/dev/null | grep -q . && break
            sleep 2
          done
          # the installer already started the pool, so the startd sees the simulated GPU only once restarted
          sudo condor_restart -daemon startd
          for i in $(seq 90); do
            condor_status -af TotalGPUs 2>/dev/null | grep '^[1-9]' >/dev/null && break
            sleep 2
          done
          condor_version
          condor_status -schedd -af Name | grep .
          condor_status -af Name State Cpus Memory TotalGPUs
          condor_status -af TotalGPUs | grep '^[1-9]'  # the live DAG legs need that GPU
      - name: Install deps + this package with the htcondor extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}"
          python -m pip install -e ".[dev,htcondor]"
          python -m pip install "tritonclient[grpc]" grpcio-health-checking
      - name: Start the Triton container
        # recipes.triton's argv at port 8001 (gRPC only), serving the m68a model repository; waited on
        # with the engine's own check_ready (the grpc.health.v1 Check, SERVING once the model loads)
        shell: bash
        run: |
          docker run -d --name graphed-triton -p 8001:8001 \
            -v "${{ github.workspace }}/tests/frozen/m68a/data/triton_models:/models:ro" \
            nvcr.io/nvidia/tritonserver:25.11-pyt-python-py3 \
            tritonserver --model-repository=/models --grpc-port=8001 --allow-http=false --allow-metrics=false
          python - <<'PY'
          import sys, time
          from graphed_executors.submit.services import check_ready
          deadline = time.monotonic() + 600
          while (reason := check_ready("grpc://localhost:8001", "grpc:", 10.0)) is not None:
              if time.monotonic() > deadline:
                  sys.exit(f"the Triton container never became ready: {reason}")
              time.sleep(5)
          print("Triton ready on grpc://localhost:8001")
          PY
      - name: Pytest frozen m66 + m67 + m68a + m68b + m68c + m68d + m69b on the pool + scoped coverage gate (>=90%)
        # a bare `--cov` keeps the rcfile's source; a path-valued one overrides it (see test-parsl)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc-htcondor
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc-htcondor
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          GRAPHED_TRITON_GRPC: localhost:8001
        run: |
          python -c "import sysconfig, pathlib; pathlib.Path(sysconfig.get_path('purelib'), 'graphed_subcov.pth').write_text('import coverage; coverage.process_startup()\n')"
          pytest tests/frozen/m66 tests/extra/m66 tests/frozen/m67 tests/extra/m67 \
            tests/frozen/m68a tests/extra/m68a tests/frozen/m68b tests/extra/m68b \
            tests/frozen/m68c tests/extra/m68c tests/frozen/m68d tests/extra/m68d \
            tests/frozen/m69b/test_histserv_cluster.py tests/frozen/m69b/test_histserv_managed.py \
            tests/frozen/m69b/test_service_order.py tests/extra/m69b \
            --cov --cov-config=.coveragerc-htcondor \
            --cov-branch --cov-fail-under=0
          mv .coverage .coverage.driver
          coverage combine
          coverage report --show-missing --fail-under=90
      - name: Per-file coverage gate (>=90% each)
        shell: bash
        run: |
          coverage json --rcfile=.coveragerc-htcondor -o coverage.json
          python scripts/coverage_gate.py coverage.json 90
      - name: Diff coverage gate (>=98% of changed lines vs main)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          git fetch origin main
          coverage xml --rcfile=.coveragerc-htcondor -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=98 \
            --include "src/graphed_executors/htcondor_backend/**/*.py" "src/graphed_executors/submit/services.py"
      - name: Stop the Triton container
        if: always()
        shell: bash
        run: |
          docker logs graphed-triton 2>&1 | tail -n 50 || true
          docker rm -f graphed-triton || true

  # m69a: examples/hgg against the original H->gg script as oracle. The main matrix has no coffea, so
  # tests/frozen/m69a skips there; here GRAPHED_HGG_REQUIRED=1 turns a missing dependency into a failure.
  # The example is outside the coverage gate.
  test-hgg:
    name: test-hgg py3.12
    runs-on: ubuntu-latest
    env:
      GRAPHED_HGG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps + this package + the coffea fork and higgs_dna
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.CORPUS }}" "${{ env.HISTOGRAM }}" \
            "${{ env.COFFEA }}" "${{ env.UPROOT }}" vector correctionlib pyarrow
          python -m pip install -e ".[dev]"
          python -m pip install --no-deps "${{ env.HIGGS_DNA }}"
      - name: Pytest m69a + the m69b diagnostics
        run: pytest -rs tests/frozen/m69a tests/frozen/m69b/test_hgg_diagnostics.py tests/frozen/m69b/test_hgg_local_pilots.py tests/extra/m69b

  docs:
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}"
          # docs only needs runtime deps + sphinx; the dev-extra backends are not on PyPI.
          python -m pip install -e ".[docs]"
          sphinx-build -W -b html docs docs/_build/html

  # The single check the ruleset requires for the merge queue: matrix legs would each need
  # naming there, and advisory (continue-on-error) jobs are left out on purpose.
  ci-required:
    name: ci required
    if: always()
    needs: [test, test-dask, test-parsl, test-htcondor, test-hgg, docs]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job succeeded
